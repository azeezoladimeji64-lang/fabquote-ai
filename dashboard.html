<script>


const tbody = document.getElementById('recent-quotes-body');

const history = fqLoadHistory();

const badgeClass = {
  accepted: 'badge-accepted',
  pending: 'badge-pending',
  draft: 'badge-draft',
  declined: 'badge-declined'
};

const badgeLabel = {
  accepted: 'Accepted',
  pending: 'Pending',
  draft: 'Draft',
  declined: 'Declined'
};

function safeText(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

if (!history.length) {
  tbody.innerHTML = `
    <tr>
      <td colspan="7" style="padding:24px; text-align:center;">
        No saved quotations yet.
        <a href="new-quotation.html">Create your first quotation</a>.
      </td>
    </tr>
  `;
} else {
  tbody.innerHTML = history.map(q => {
    const number = safeText(q.quoteNumber || '—');
    const customer = safeText(q.customerName || 'Unnamed customer');
    const company = safeText(q.company || '');
    const job = safeText(q.jobTitle || 'Untitled job');
    const amount = fqFormatCurrency(
      q.grandTotal ?? fqCalculateQuote(q).grandTotal
    );
    const status = badgeClass[q.status] ? q.status : 'pending';
    const date = safeText(q.createdDate || '—');

    return `
      <tr>
        <td class="mono text-dim">${number}</td>
        <td>${customer}<br>
          <span class="text-faint" style="font-size:12.5px;">
            ${company}
          </span>
        </td>
        <td class="text-dim">${job}</td>
        <td class="mono">${amount}</td>
        <td>
          <span class="badge ${badgeClass[status]}">
            ${badgeLabel[status]}
          </span>
        </td>
        <td class="text-faint">${date}</td>
        <td>
          <a href="quotation-preview.html?quote=${encodeURIComponent(q.quoteNumber || '')}"
             class="btn btn-ghost btn-sm">View →</a>
        </td>
      </tr>
    `;
  }).join('');
}

// Dashboard statistics

  savedQuotes.length + demoQuotes.length;


const pendingQuotes =
  savedQuotes.filter(q => q.status === 'pending').length +
  demoQuotes.filter(q => q.status === 'pending').length;


const acceptedQuotes =
  savedQuotes.filter(q => q.status === 'accepted').length +
  demoQuotes.filter(q => q.status === 'accepted').length;

allQuotes.forEach(q => {

  if (q.status !== 'declined') {

    totalRevenue += Number(q.amount) || 0;

  }

});


// Update dashboard cards
const statNumbers =
  document.querySelectorAll('.card h2');


if (statNumbers.length >= 4) {

  statNumbers[0].textContent =
    totalQuotes;

  statNumbers[1].textContent =
    pendingQuotes;

  statNumbers[2].textContent =
    acceptedQuotes;

  statNumbers[3].textContent =
    totalRevenue >= 1000000
      ? '$' + (totalRevenue / 1000000).toFixed(1) + 'm'
      : '$' + (totalRevenue / 1000).toFixed(1) + 'k';

}

</script>
