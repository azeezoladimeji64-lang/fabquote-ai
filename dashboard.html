<script>

const demoQuotes = [
  {
    num: 'FQ-2026-0148',
    customer: 'Marcus Delgado',
    company: 'Delgado Steel Works',
    job: 'Structural bracket set — loading dock canopy',
    amount: 5003.02,
    status: 'pending',
    date: 'Sep 4, 2026'
  },
  {
    num: 'FQ-2026-0147',
    customer: 'Anita Kowalski',
    company: 'Kowalski CNC Precision',
    job: 'Aluminum housing, 60x CNC milled',
    amount: 8420.50,
    status: 'accepted',
    date: 'Sep 2, 2026'
  },
  {
    num: 'FQ-2026-0146',
    customer: 'Devon Ruiz',
    company: 'Ruiz Welding & Fab',
    job: 'Custom stair railing, powder-coated',
    amount: 2760.00,
    status: 'accepted',
    date: 'Aug 30, 2026'
  },
  {
    num: 'FQ-2026-0145',
    customer: 'Grace Okafor',
    company: 'Okafor Mechanical Systems',
    job: 'Conveyor frame assembly, qty 3',
    amount: 14310.75,
    status: 'draft',
    date: 'Aug 29, 2026'
  },
  {
    num: 'FQ-2026-0144',
    customer: 'Liam Foster',
    company: 'Foster Sheet Metal',
    job: 'HVAC ductwork, gauge 22 galvanized',
    amount: 3195.40,
    status: 'declined',
    date: 'Aug 27, 2026'
  }
];


// Get quotes created by the user
const savedQuotes = fqLoadHistory();


// Convert saved quotes into dashboard format
const realQuotes = savedQuotes.map(q => {

  const totals = fqCalculateQuote(q);

  return {
    num: q.quoteNumber,
    customer: q.customerName || 'Unnamed customer',
    company: q.company || '',
    job: q.jobTitle || 'Untitled job',
    amount: totals.grandTotal,
    status: q.status || 'pending',
    date: q.createdDate || ''
  };

});


// Put real quotes first
const allQuotes = [
  ...realQuotes,
  ...demoQuotes
];


// Remove duplicate quote numbers
const uniqueQuotes = [];

const seen = new Set();

allQuotes.forEach(q => {

  if (!seen.has(q.num)) {
    seen.add(q.num);
    uniqueQuotes.push(q);
  }

});


// Only show the latest 10
const displayQuotes =
  uniqueQuotes.slice(0, 10);


// Status styles
const badgeClass = {
  accepted: 'badge-accepted',
  pending: 'badge-pending',
  draft: 'badge-draft',
  declined: 'badge-declined'
};


const badgeLabel = {
  accepted: 'Accepted',
  pending: 'Pending',
  draft: 'Draft',
  declined: 'Declined'
};


// Render quotation table
const tbody =
  document.getElementById('recent-quotes-body');


tbody.innerHTML = displayQuotes.map(q => `

  <tr>

    <td class="mono text-dim">
      ${q.num}
    </td>

    <td>
      ${q.customer}
      <br>
      <span
        class="text-faint"
        style="font-size:12.5px;"
      >
        ${q.company}
      </span>
    </td>

    <td class="text-dim">
      ${q.job}
    </td>

    <td class="mono">
      ${fqFormatCurrency(q.amount)}
    </td>

    <td>
      <span class="badge ${badgeClass[q.status] || 'badge-pending'}">
        ${badgeLabel[q.status] || 'Pending'}
      </span>
    </td>

    <td class="text-faint">
      ${q.date}
    </td>

    <td>
      <a
        href="quotation-preview.html"
        class="btn btn-ghost btn-sm"
      >
        View →
      </a>
    </td>

  </tr>

`).join('');


// --------------------------------------------------------------------------
// Dashboard statistics
// --------------------------------------------------------------------------

const totalQuotes =
  savedQuotes.length + demoQuotes.length;


const pendingQuotes =
  savedQuotes.filter(q => q.status === 'pending').length +
  demoQuotes.filter(q => q.status === 'pending').length;


const acceptedQuotes =
  savedQuotes.filter(q => q.status === 'accepted').length +
  demoQuotes.filter(q => q.status === 'accepted').length;


// Calculate revenue from all quotations
let totalRevenue = 0;

allQuotes.forEach(q => {

  if (q.status !== 'declined') {

    totalRevenue += Number(q.amount) || 0;

  }

});


// Update dashboard cards
const statNumbers =
  document.querySelectorAll('.card h2');


if (statNumbers.length >= 4) {

  statNumbers[0].textContent =
    totalQuotes;

  statNumbers[1].textContent =
    pendingQuotes;

  statNumbers[2].textContent =
    acceptedQuotes;

  statNumbers[3].textContent =
    totalRevenue >= 1000000
      ? '$' + (totalRevenue / 1000000).toFixed(1) + 'm'
      : '$' + (totalRevenue / 1000).toFixed(1) + 'k';

}

</script>
